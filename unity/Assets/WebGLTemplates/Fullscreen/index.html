<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
      html, body {
        margin: 0; padding: 0; width: 100%; height: 100%;
        overflow: hidden; background: #08080c;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      #unity-container { position: absolute; inset: 0; }
      /* The canvas fills the viewport. Unity keeps the WebGL render target matched to the
         canvas DOM size (scaled by devicePixelRatio), so resizing the window just works. */
      #unity-canvas { display: block; width: 100%; height: 100%; background: #08080c; }

      #unity-loading-bar {
        position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
        display: none; text-align: center; color: #b9c0cc;
      }
      #unity-progress-bar-empty {
        width: 260px; height: 6px; margin: 14px auto 0;
        background: #1c1f27; border-radius: 3px; overflow: hidden;
      }
      #unity-progress-bar-full {
        width: 0%; height: 100%; background: #d8b23f; transition: width .15s ease-out;
      }
      #unity-loading-title { font-size: 15px; letter-spacing: .06em; text-transform: uppercase; }

      #unity-fullscreen-button {
        position: absolute; right: 14px; bottom: 14px; width: 48px; height: 48px;
        cursor: pointer; opacity: .55; border-radius: 6px;
        background: #e8e8ee;
        clip-path: polygon(0 0, 40% 0, 40% 14%, 14% 14%, 14% 40%, 0 40%,
                           100% 0, 100% 40%, 86% 40%, 86% 14%, 60% 14%, 60% 0,
                           100% 100%, 60% 100%, 60% 86%, 86% 86%, 86% 60%, 100% 60%,
                           0 100%, 0 60%, 14% 60%, 14% 86%, 40% 86%, 40% 100%);
      }
      #unity-fullscreen-button:hover { opacity: .8; }

      #unity-warning { position: absolute; left: 50%; top: 8px; transform: translateX(-50%); z-index: 10; }
      #unity-warning div { margin: 4px; padding: 8px 12px; border-radius: 4px; color: #111; }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" width={{{ WIDTH }}} height={{{ HEIGHT }}} tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-loading-title">{{{ PRODUCT_NAME }}}</div>
        <div id="unity-progress-bar-empty"><div id="unity-progress-bar-full"></div></div>
      </div>
      <div id="unity-warning"></div>
      <div id="unity-fullscreen-button" title="Fullscreen"></div>
    </div>

    <script>
      var canvas = document.querySelector("#unity-canvas");

      function unityShowBanner(msg, type) {
        var banner = document.querySelector("#unity-warning");
        function refresh() { banner.style.display = banner.children.length ? 'block' : 'none'; }
        var div = document.createElement('div');
        div.innerHTML = msg;
        banner.appendChild(div);
        if (type == 'error') div.style.background = '#ff6a6a';
        else {
          if (type == 'warning') div.style.background = '#ffd76a';
          setTimeout(function () { banner.removeChild(div); refresh(); }, 5000);
        }
        refresh();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_WASM
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        showBanner: unityShowBanner,

        // Unity hooks window.onerror and puts a modal ALERT over the game for anything that
        // reaches it. Its own filter list has exactly one entry, "fullscreen error", and that is
        // not the message Android Chrome produces: it refuses the orientation lock Unity does
        // inside SetFullscreen with "TypeError: Permissions check failed", and it does it
        // asynchronously out of a promise chain we do not own - so neither the try/catch nor the
        // .catch on the return value below ever sees it. The loader takes errorHandler as a
        // documented hook and skips its alert when one returns true.
        //
        // Scoped to that one message on purpose. Swallowing everything here would hide the real
        // crashes this dialog exists to report.
        errorHandler: function (message) {
          var text = typeof message === "string" ? message : (message && message.message) || "";
          if (text.indexOf("Permissions check failed") !== -1
              || text.indexOf("fullscreen error") !== -1) {
            console.warn("browser declined fullscreen or the orientation lock:", text);
            return true;
          }

          // WHAT THE HEAP WAS WHEN IT DIED. "RuntimeError: null function" under
          // MemoryManager::Reallocate has now been reported twice, and the modal that carries it
          // says nothing about memory - so the 512MB in WebGLBuild.cs was chosen against a guess
          // and the same crash came back. This is the missing number. It goes to the CONSOLE, not
          // the banner: `return false` below is deliberate, so Unity still shows its own modal
          // with the copyable stack, and a banner would HTML-inject a multi-line trace into a div.
          try {
            var m = window.unityInstance && window.unityInstance.Module;
            console.error("[srd] crash @ heap "
              + (m && m.HEAPU8 ? (m.HEAPU8.length / 1048576 | 0) + "MB" : "unknown")
              + ", deviceMemory " + (navigator.deviceMemory || "?") + "GB"
              + ", dpr " + window.devicePixelRatio
              + ", build " + (window.srdBuildVersion || "?")
              + " — " + text);
          } catch (e) { /* never let the reporter be the thing that throws */ }

          return false;
        },
      };

      // No manual canvas sizing here on purpose. config.matchWebGLToCanvasSize defaults to true,
      // so Unity keeps the WebGL render target matched to the canvas DOM box (scaled by
      // devicePixelRatio) on every resize. Doing it by hand as well is not just redundant - if the
      // canvas is measured while its box is zero-sized (a hidden tab, a collapsed pane, a
      // display:none ancestor) it would clamp the drawing buffer to zero and the context would
      // come back blank.

      document.querySelector("#unity-loading-bar").style.display = "block";

      // ── ONE BUILD, NOT FOUR ────────────────────────────────────────────────────────────────
      //
      // The four files this player is about to download have FIXED names, and GitHub Pages serves
      // each of them with its own `Cache-Control: max-age=600`. The edges expire independently -
      // caught in the act with Age: 376 on the framework and Age: 0 on the data - so for a window
      // after every deploy a client can be handed a NEW .wasm and an OLD .data.
      //
      // Unity cannot survive that for an instant. The data file is a flat blob the code indexes by
      // byte offset, so a mismatched pair is not a version error, it is garbage: buffer sizes that
      // read past their own allocation (GfxDevice::CopyBufferRanges out of bounds), an index out
      // of range inside the render graph, then "memory access out of bounds" and a halted program.
      // From the outside that is a loading bar that never finishes - "the game is not loading" -
      // and it clears on a reload, which is what makes it look intermittent and unreportable.
      //
      // So the version is fetched FIRST, uncacheably, and stamped onto all four URLs. Two things
      // follow: a new build's URLs have never been requested before, so nothing stale can answer
      // them; and a player still holding a cached index.html reads the CURRENT stamp anyway, so
      // even the old page loads a consistent set.
      //
      // version.txt is written by tools/deploy-webgl.sh when it stages. Without it - the raw
      // player, a local run - the stamp is empty and the URLs are exactly what they always were.
      function boot(stamp) {
        window.srdBuildVersion = stamp || "";   // so a crash report can name the build it came from
        var q = stamp ? "?v=" + encodeURIComponent(stamp) : "";
        config.dataUrl += q;
        config.frameworkUrl += q;
        if (config.codeUrl) config.codeUrl += q;
        if (config.symbolsUrl) config.symbolsUrl += q;

        var script = document.createElement("script");
        script.src = loaderUrl + q;
        script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          window.unityInstance = unityInstance;
          document.querySelector("#unity-loading-bar").style.display = "none";
          document.querySelector("#unity-fullscreen-button").onclick = () => {
            unityInstance.SetFullscreen(1);
          };
          // Phones: enter fullscreen on the FIRST touch anywhere on the game, so the browser
          // chrome gets out of the way without hunting for the corner button. Touch-only -
          // auto-fullscreen on a desktop click would be obnoxious - and once only: if the
          // player backs out of fullscreen, that choice is respected.
          if (window.matchMedia && window.matchMedia("(pointer: coarse)").matches) {
            canvas.addEventListener("pointerdown", function goFs() {
              if (document.fullscreenElement) return;
              // A browser is allowed to REFUSE this. Android Chrome throws
              // "TypeError: Permissions check failed" out of the orientation lock Unity does
              // inside SetFullscreen, and an uncaught throw here reaches Unity's global error
              // handler, which puts a modal alert over the game. Fullscreen is a nicety; failing
              // to get it must cost the player nothing but a browser bar.
              try {
                const p = unityInstance.SetFullscreen(1);
                if (p && typeof p.catch === "function") p.catch(function () {});
              } catch (e) {
                console.warn("fullscreen declined by the browser:", e && e.message);
              }
            }, { once: true });
          }
          canvas.focus();
        }).catch((message) => {
          unityShowBanner(message, 'error');
        });
        };
        document.body.appendChild(script);
      }

      fetch(buildUrl + "/version.txt?t=" + Date.now(), { cache: "no-store" })
        .then(function (r) { return r.ok ? r.text() : ""; })
        .then(function (t) { boot((t || "").trim()); })
        .catch(function () { boot(""); });
    </script>
  </body>
</html>
